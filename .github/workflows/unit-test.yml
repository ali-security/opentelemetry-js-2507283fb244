name: Unit Tests
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Extra nx run-many arguments to scope the tests (e.g. --projects=@opentelemetry/core); empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  node-tests:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "24"
          - "25"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}
      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        shell: bash
        run: |
          # Redirect to a file instead of piping: nx's final output (last task's
          # log + run summary) is intermittently lost when written to a pipe at exit.
          trap 'cat seal-test.log' EXIT
          npm test -- ${{ inputs.test-filter }} > seal-test.log 2>&1

      - name: Test summary
        shell: bash
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' seal-test.log > seal-test.clean.log
          awk '/^[[:space:]]*[0-9]+ passing/{p+=$1; n++} /^[[:space:]]*[0-9]+ failing/{f+=$1} /^[[:space:]]*[0-9]+ pending/{q+=$1} END{printf "Mocha totals across %d test runs: %d passing, %d failing, %d pending\n", n, p, f, q}' seal-test.clean.log
          awk '/nx run @opentelemetry\/core:test/{c=1} c && /^[[:space:]]*[0-9]+ passing/{print "@opentelemetry/core: " $1 " passing"; exit}' seal-test.clean.log
          grep -E 'Successfully ran target test' seal-test.clean.log

      - name: Pack @opentelemetry/core
        if: ${{ matrix.node_version == '22' }}
        run: |
          mkdir -p ./seal-dist
          npm pack --workspace=packages/opentelemetry-core --pack-destination=./seal-dist
          mv ./seal-dist/opentelemetry-core-2.6.1.tgz ./seal-dist/core-2.6.1.tgz

      - name: Upload @opentelemetry/core tarball
        if: ${{ matrix.node_version == '22' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-2.6.1
          path: seal-dist/core-2.6.1.tgz
          if-no-files-found: error
  node-windows-tests:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '22'

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        shell: bash
        run: |
          # Redirect to a file instead of piping: nx's final output (last task's
          # log + run summary) is intermittently lost when written to a pipe at exit.
          trap 'cat seal-test.log' EXIT
          npm run test -- ${{ inputs.test-filter }} > seal-test.log 2>&1

      - name: Test summary
        shell: bash
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' seal-test.log > seal-test.clean.log
          awk '/^[[:space:]]*[0-9]+ passing/{p+=$1; n++} /^[[:space:]]*[0-9]+ failing/{f+=$1} /^[[:space:]]*[0-9]+ pending/{q+=$1} END{printf "Mocha totals across %d test runs: %d passing, %d failing, %d pending\n", n, p, f, q}' seal-test.clean.log
          awk '/nx run @opentelemetry\/core:test/{c=1} c && /^[[:space:]]*[0-9]+ passing/{print "@opentelemetry/core: " $1 " passing"; exit}' seal-test.clean.log
          grep -E 'Successfully ran target test' seal-test.clean.log
  browser-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser -- ${{ inputs.test-filter }}
  webworker-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker -- ${{ inputs.test-filter }}
